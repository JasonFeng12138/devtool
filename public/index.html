<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevTool 工具箱</title>
  <script>
    // 首帧前确定主题与侧栏模式，避免闪烁
    (() => {
      const saved = localStorage.getItem('devtool-theme');
      const dark = matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
      document.documentElement.dataset.sidebar = localStorage.getItem('devtool-sidebar') || 'pinned';
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <aside class="sidebar glass">
    <div class="sidebar-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </span>
      <span class="brand-name">DevTool</span>
    </div>
    <nav id="tool-nav" class="sidebar-nav scroll-area" aria-label="工具导航"></nav>
    <div class="sidebar-footer">
      <button id="theme-toggle" class="nav-item" type="button"></button>
      <button id="sidebar-pin" class="nav-item sidebar-pin" type="button"></button>
    </div>
  </aside>

  <main class="main scroll-area">
    <header class="titlebar">
      <div class="container">
        <h1 id="page-title" class="page-title"></h1>
        <p id="page-desc" class="page-desc"></p>
      </div>
    </header>
    <div class="content">
      <div id="tool-root" class="container"></div>
    </div>
  </main>

  <div id="toast" class="toast glass" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
